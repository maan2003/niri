[package]
name = "drv-supervisor"
version.workspace = true
description = "Starts the trusted set (seatd, authd, compositor, appd, forker), wires them with socketpairs and restarts what dies"
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
drv-os = { version = "26.4.0", path = "../drv-os" }
drv-policy = { version = "26.4.0", path = "../drv-policy" }
libc = "0.2"
rustix = { version = "1.1.4", features = ["fs", "net", "process", "std", "thread"] }

[[bin]]
name = "drv-supervisor"
path = "src/bin/drv-supervisor.rs"
