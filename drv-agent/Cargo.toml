[package]
name = "drv-agent"
version = "26.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The ssh agent: OpenSSH's ssh-agent behind a door that knows which UIDs may knock."

[dependencies]
clap = { version = "4.5", features = ["derive"] }
drv-os = { version = "26.4.0", path = "../drv-os" }
drv-policy = { version = "26.4.0", path = "../drv-policy" }
drv-shell = { version = "26.4.0", path = "../drv-shell", default-features = false }
rustix = { version = "1.1.4", features = ["fs", "net", "std"] }
