[package]
name = "drv-appd"
version.workspace = true
description = "The app daemon: knows every app (one fixed UID each), answers who a UID is, starts apps through drv-forker"
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
libc = "0.2"
clap.workspace = true
drv-os = { version = "26.4.0", path = "../drv-os" }
drv-policy = { version = "26.4.0", path = "../drv-policy" }
rustix = { version = "1.1.4", features = ["process"] }
serde.workspace = true
toml = "1"

[[bin]]
name = "drv"
path = "src/bin/drv.rs"

[[bin]]
name = "drv-appd"
path = "src/bin/drv-appd.rs"
