[package]
name = "drv-init"
version.workspace = true
description = "PID 1 of an app's namespace: links its /etc and state, forks the app, stays as its init"
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
drv-os = { version = "26.4.0", path = "../drv-os" }
libc = "0.2"
rustix = { version = "1.1.4", features = ["process"] }

[[bin]]
name = "drv-init"
path = "src/main.rs"
