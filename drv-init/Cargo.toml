[package]
name = "drv-init"
version.workspace = true
description = "The first thing that runs as an app: makes its root its own, restricts itself, runs it, stays as its init"
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
drv-os = { version = "26.4.0", path = "../drv-os" }
libc = "0.2"
rustix = { version = "1.1.4", features = ["fs", "process", "std", "thread"] }

[[bin]]
name = "drv-init"
path = "src/main.rs"
