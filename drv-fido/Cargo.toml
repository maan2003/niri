[package]
name = "drv-fido"
version = "26.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The FIDO door: WebAuthn ceremonies on the security key for the apps whose manifest lists their origins, a member of the set of its own."

[features]
default = ["service"]
# The binary; off for crates that want only the door's wire (the shim).
service = ["dep:drv-os", "dep:drv-shell", "dep:libwebauthn", "dep:serde_json", "dep:tokio"]

[dependencies]
drv-os = { version = "26.4.0", path = "../drv-os", optional = true }
drv-policy = { version = "26.4.0", path = "../drv-policy" }
drv-shell = { version = "26.4.0", path = "../drv-shell", default-features = false, features = ["client"], optional = true }
# linux-credentials' WebAuthn client: CTAP2 over the hidraw nodes. No BLE, NFC or hybrid.
# The fork carries hmacGetSecret through the JSON request path (rho/hmac-get-secret; upstream PR 312 pending).
libwebauthn = { git = "https://github.com/maan2003/libwebauthn", rev = "fb735a70ff3ab308675e5fc3527f800a698f80ae", default-features = false, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }

[[bin]]
name = "drv-fido"
path = "src/main.rs"
required-features = ["service"]
