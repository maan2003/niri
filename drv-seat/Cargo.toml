[package]
name = "drv-seat"
version.workspace = true
description = "Seat daemon: hands DRM and input device fds to the compositor"
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
drv-os = { version = "26.4.0", path = "../drv-os" }
clap = { version = "4.5", features = ["derive"] }
drv-policy = { version = "26.4.0", path = "../drv-policy" }
libc = "0.2"
libseat = "0.2.4"
postcard = { version = "1.1.3", features = ["use-std"] }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "std"] }
serde.workspace = true
udev = "0.9.3"

[[bin]]
name = "drv-seatd"
path = "src/bin/drv-seatd.rs"
