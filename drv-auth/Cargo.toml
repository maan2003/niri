[package]
name = "drv-auth"
version = "26.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Screen-lock auth daemon: verifies the PIN and tells the compositor to unlock."

[dependencies]
argon2 = "0.5.3"
clap = { version = "4.5", features = ["derive"] }
drv-policy = { version = "26.4.0", path = "../drv-policy" }
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
postcard = { version = "1.1", features = ["alloc"] }
rustix = { version = "1.1", features = ["fs", "net", "process", "std", "thread"] }
serde = { version = "1.0", features = ["derive"] }
zeroize = "1"

[[bin]]
name = "drv-authd"
