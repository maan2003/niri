[package]
name = "drv-bridge"
version.workspace = true
description = "Desktop services for sandboxed apps: a UID-keyed server on the human's side, a shim on each app's private bus"
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
drv-os = { version = "26.4.0", path = "../drv-os" }
drv-policy = { version = "26.4.0", path = "../drv-policy" }
drv-portal = { version = "26.4.0", path = "../drv-portal" }
rustix = { version = "1.1.4", features = ["net", "process", "std"] }
serde.workspace = true
zbus = { version = "5", features = ["bus-impl"] }

[[bin]]
name = "drv-bridge"
path = "src/main.rs"
